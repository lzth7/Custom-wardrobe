        h1 {

            color: #70458c;

        }

        .zona-personaje {

            max-width: 450px;
            aspect-ratio: 3 / 4;
            margin: auto;

            border-radius: 20px;
            overflow: hidden;
            display: flex;

            align-items: center;

     max-height: 900px;        
        }

        .zona-personaje {

    place-items: center;
}

.zona-personaje img {
    width: 95%;
    height: auto;
    max-height: 900px;
    object-fit: contain;
    grid-area: 1 / 1;
    }
        .controles {

        .categoria h2 {

        }

        .botones {

            flex-wrap: wrap;
        }

            background: #c99ddd;
            color: #392542;
            padding: 10px 16px;
            border-radius: 12px;

            font-size: 14px;
        }

        button:hover {

        }

        .aleatorio {
            width: 100%;
            margin-top: 10px;
            background: #8c5aa8;
            color: white;
            font-weight: bold;
        }

.capas-boton {
    width: 100%;
    margin-top: 10px;

    color: #392542;

}

.menu-capas {

.menu-capas p {

.cerrar-capas {

.carrusel {

    width: 100%;
}

.ventana-carrusel {
    overflow: hidden;
    flex: 1;
    min-width: 0;
}

.ventana-carrusel .botones {
    flex-wrap: nowrap;
    transition: transform 0.3s ease;

.ventana-carrusel .botones button {

.flecha {

let ordenCapas = [
    "abajo",
    "arriba",
    "zapatos",
    "cabello",
    "accesorios",
    "conjuntos"
];

function obtenerElementoCapa(categoria) {

    const ids = {
        arriba: "prenda-arriba",
        abajo: "prenda-abajo",
        conjuntos: "prenda-conjunto",
        zapatos: "prenda-zapatos",
        cabello: "prenda-cabello",
        accesorios: "prenda-accesorios"
    };

    return document.getElementById(ids[categoria]);
}


function actualizarCapas() {

    ordenCapas.forEach((categoria, indice) => {

        const elemento = obtenerElementoCapa(categoria);

        if (elemento) {
            elemento.style.zIndex = indice + 1;
        }

    });
}


function obtenerCategoriaSeleccionada() {

    return document.getElementById("prenda-seleccionada").value;

}


function subirCapa() {

    const categoria = obtenerCategoriaSeleccionada();
    const posicion = ordenCapas.indexOf(categoria);

    if (posicion < ordenCapas.length - 1) {

        [ordenCapas[posicion], ordenCapas[posicion + 1]] =
        [ordenCapas[posicion + 1], ordenCapas[posicion]];

        actualizarCapas();
    }
}


function bajarCapa() {

    const categoria = obtenerCategoriaSeleccionada();
    const posicion = ordenCapas.indexOf(categoria);

    if (posicion > 0) {

        [ordenCapas[posicion], ordenCapas[posicion - 1]] =
        [ordenCapas[posicion - 1], ordenCapas[posicion]];

        actualizarCapas();
    }
}


function frenteCapa() {

    const categoria = obtenerCategoriaSeleccionada();
    const posicion = ordenCapas.indexOf(categoria);

    ordenCapas.splice(posicion, 1);
    ordenCapas.push(categoria);

    actualizarCapas();
}


function fondoCapa() {

    const categoria = obtenerCategoriaSeleccionada();
    const posicion = ordenCapas.indexOf(categoria);

    ordenCapas.splice(posicion, 1);
    ordenCapas.unshift(categoria);

    actualizarCapas();
}


function mostrarMenuCapas() {

    const menu = document.getElementById("menu-capas");

    if (menu.style.display === "block") {
        menu.style.display = "none";
    } else {
        menu.style.display = "block";
    }

            }

        actualizarCapas();

        let posicionesCarrusel = {};

function moverCarrusel(categoria, direccion) {

    const botones = document.getElementById("botones-" + categoria);

    if (!botones) return;

    if (!posicionesCarrusel[categoria]) {
        posicionesCarrusel[categoria] = 0;
    }

    const cantidadBotones = botones.children.length;

    const botonesVisibles = 2;

    const maximo = Math.max(0, cantidadBotones - botonesVisibles);

    posicionesCarrusel[categoria] += direccion;

    if (posicionesCarrusel[categoria] < 0) {
        posicionesCarrusel[categoria] = 0;
    }

    if (posicionesCarrusel[categoria] > maximo) {
        posicionesCarrusel[categoria] = maximo;
    }

    const anchoBoton = botones.children[0].offsetWidth;
    const espacio = 10;

    const desplazamiento =
        posicionesCarrusel[categoria] * (anchoBoton + espacio);

    botones.style.transform =
        `translateX(-${desplazamiento}px)`;
        }

        function desplazarCategoria(id, direccion) {
    const contenedor = document.getElementById(id);

    contenedor.scrollBy({
        left: direccion * 300,
        behavior: "smooth"
    });
        }
